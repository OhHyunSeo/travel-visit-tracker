pluginManagement {
    def reactPlugin = new File(providers.exec {
        workingDir(rootDir)
        commandLine('node', '--print', "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()).parentFile
    includeBuild(reactPlugin.absolutePath)
    def expoPlugin = new File(providers.exec {
        workingDir(rootDir)
        commandLine('node', '--print', "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(), '../android/expo-gradle-plugin')
    includeBuild(expoPlugin.absolutePath)
}

plugins {
    id('com.facebook.react.settings')
    id('expo-autolinking-settings')
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { extension ->
    extension.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
}
expoAutolinking.useExpoModules()
expoAutolinking.useExpoVersionCatalog()
rootProject.name = 'trip-map-rn-recovery'
include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
