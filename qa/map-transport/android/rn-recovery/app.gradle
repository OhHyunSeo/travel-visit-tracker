apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

react {
    entryFile = file('../../index.js')
    cliFile = file(['node', '--print', "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"]
        .execute(null, rootDir).text.trim())
    def hermesDir = file(['node', '--print', "require.resolve('hermes-compiler/package.json', { paths: [require.resolve('react-native/package.json')] })"]
        .execute(null, rootDir).text.trim()).parentFile
    hermesCommand = "${hermesDir}/hermesc/%OS-BIN%/hermesc"
    bundleCommand = 'export:embed'
    debuggableVariants = []
    autolinkLibrariesWithApp()
}

android {
    namespace = 'app.trippainting.maptransportqa'
    compileSdk = 36
    ndkVersion = rootProject.ext.ndkVersion
    defaultConfig {
        applicationId = 'app.trippainting.maptransportqa.rn'
        minSdk = 36
        targetSdk = 36
        versionCode = 1
        versionName = '1'
        ndk.abiFilters.add('arm64-v8a')
    }
    signingConfigs.debug {
        storeFile = file('fixture-debug.keystore')
        storePassword = 'android'
        keyAlias = 'androiddebugkey'
        keyPassword = 'android'
    }
    packaging.jniLibs.keepDebugSymbols.add('**/libmaplibre.so')
}

dependencies {
    implementation 'com.facebook.react:react-android'
    implementation 'com.facebook.react:hermes-android'
    implementation 'org.maplibre.gl:android-sdk-opengl:13.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
